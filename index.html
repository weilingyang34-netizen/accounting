<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>会计案例库</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a ledger book. Masthead with a double rule, a sticky tab strip, then ruled panels with debit and credit columns divided by a vertical rule. */
:root {
  --f-display: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --bg: #eef2f1; --panel: #ffffff; --ink: #0f1f1d; --ink2: #46585a; --mute: #5c6d6e;
  --line: #d6dfdd; --rule: #aebdba; --accent: #0e6b62; --accent-ink: #ffffff; --tint: #e4f1ee;
  --good: #0a6b36; --watch: #9a5800; --bad: #b3261e;
  --s1: #2a78d6; --s2: #eb6834; --grid: #e1e0d9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1514; --panel: #121e1d; --ink: #e6efed; --ink2: #a9bcba; --mute: #8fa4a1;
    --line: #243635; --rule: #3a5754; --accent: #3fb5a6; --accent-ink: #06201d; --tint: #17302d;
    --good: #4fcf86; --watch: #f0b050; --bad: #ff8a80; --s1: #3987e5; --s2: #d95926; --grid: #2c2c2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1514; --panel: #121e1d; --ink: #e6efed; --ink2: #a9bcba; --mute: #8fa4a1;
  --line: #243635; --rule: #3a5754; --accent: #3fb5a6; --accent-ink: #06201d; --tint: #17302d;
  --good: #4fcf86; --watch: #f0b050; --bad: #ff8a80; --s1: #3987e5; --s2: #d95926; --grid: #2c2c2a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cobar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 16px; font-size: 13px; color: var(--ink2); }
.cobar select { background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 6px 10px; min-height: 36px; max-width: 100%; font-weight: 500; color: var(--ink); }
.cobar .ind { color: var(--mute); }
.focus { margin: 0 0 18px; padding: 10px 14px; background: var(--tint); border-radius: 6px; font-size: 13.5px; color: var(--ink2); max-width: 80ch; }
.focus strong { color: var(--accent); margin-right: 6px; }
.empty-hide { display: none; }
.mast { padding: 28px 0 18px; border-bottom: 3px double var(--rule); }
.eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font: 700 clamp(28px, 6vw, 44px)/1.1 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.lede { margin: 12px 0 0; max-width: 62ch; color: var(--ink2); }
.stamp { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink2); }
.stamp b { font-family: var(--f-num); font-weight: 500; color: var(--ink); }
.stamp .k { color: var(--mute); }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 22px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs { overflow-y: hidden; overscroll-behavior: contain; touch-action: pan-x; -webkit-overflow-scrolling: touch; }
.tabs a { flex: none; padding: 12px 14px; color: var(--ink2); text-decoration: none; font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

h2 { margin: 0 0 4px; font: 700 20px/1.3 var(--f-display); }
h3 { margin: 0 0 6px; font: 600 16px/1.4 var(--f-display); }
.help { margin: 0 0 14px; color: var(--ink2); font-size: 13.5px; max-width: 70ch; }
.sec { margin-bottom: 36px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 28px; }
.kpi { background: var(--panel); padding: 14px 16px; min-width: 0; }
.kpi .l { font-size: 12.5px; color: var(--ink2); }
.kpi .n { margin-top: 2px; font: 500 21px/1.3 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .h { margin-top: 2px; font-size: 12px; color: var(--mute); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 6px 0 10px; font-size: 13px; color: var(--ink2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.legend b { font: 500 13px var(--f-num); color: var(--ink); }
.chart { width: 100%; min-width: 0; position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; }
.tx { fill: var(--mute); font: 10px var(--f-num); }
.gl { stroke: var(--grid); stroke-width: 1; }
.ax { stroke: var(--rule); stroke-width: 1; }
.b1 { fill: var(--s1); } .b2 { fill: var(--s2); }
.ln { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; }
.ar { fill: var(--s1); opacity: .12; }
.dot { fill: var(--s1); stroke: var(--panel); stroke-width: 2; }
.cross { stroke: var(--mute); stroke-width: 1; stroke-dasharray: 3 3; }
.note { font-size: 12.5px; color: var(--mute); margin: 8px 0 0; }
details { margin-top: 10px; font-size: 13px; }
summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 4px; font-size: 12px; line-height: 1.5; max-width: 240px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }

.tw { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 7px 10px; text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--ink2); font-size: 12.5px; }
thead th { border-bottom: 1px solid var(--rule); white-space: nowrap; }
.r { text-align: right; } td.r, td.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr + tr td, tbody tr + tr th { border-top: 1px solid var(--line); }
.code { font-family: var(--f-num); color: var(--mute); margin-right: 8px; font-size: 12.5px; }

.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.btn { background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ctl select, .ctl input { background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 6px 10px; min-height: 36px; max-width: 100%; }
.ctl label { font-size: 13px; color: var(--ink2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 7px 14px; cursor: pointer; min-height: 36px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.ok { color: var(--good); font-weight: 500; font-size: 13px; }
.sum { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 12px; font-size: 13.5px; color: var(--ink2); }
.v { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
.v > header { display: flex; flex-wrap: wrap; gap: 2px 14px; padding: 8px 12px; background: var(--tint); border-bottom: 1px solid var(--line); }
.vno { font: 500 12.5px var(--f-num); color: var(--accent); }
.vm { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.v table .cr td:first-child { padding-left: 2.2em; }
.v th.r:nth-child(3), .v td:nth-child(3) { border-left: 1px solid var(--line); }
.v tfoot td { border-top: 3px double var(--rule); font-weight: 600; }
.v td:first-child { min-width: 11em; }
.lvl { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; margin-left: 6px; vertical-align: middle; border: 1px solid var(--rule); color: var(--ink2); }
.lvl.l1 { border-color: var(--accent); color: var(--accent); }
.lvl.l3 { background: var(--ink2); color: var(--panel); border-color: var(--ink2); }
tr.red td { color: #b3261e; }
.empty { padding: 28px 12px; text-align: center; color: var(--mute); background: var(--panel); border: 1px dashed var(--rule); border-radius: 6px; }

.st { min-width: 360px; }
.st th[scope="row"] { font-weight: 400; color: var(--ink); font-size: 13.5px; }
.st tr.h th { padding-top: 14px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border-top: 0; }
.st tr.s td, .st tr.s th { font-weight: 600; border-top: 1px solid var(--rule); }
.st tr.T td, .st tr.T th { font-weight: 700; border-top: 1px solid var(--rule); border-bottom: 3px double var(--rule); }
.st tr.p td, .st tr.p th { color: var(--mute); font-style: italic; font-size: 12.5px; }
.st tr.i th[scope="row"] { padding-left: 22px; }

.fl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.fl li { display: flex; gap: 12px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.chip { flex: none; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
.t-good .chip { color: var(--good); } .t-watch .chip { color: var(--watch); } .t-info .chip { color: var(--ink2); }
.ai { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; }
.ai h3 { margin-top: 16px; color: var(--accent); }
.ai h3:first-child { margin-top: 0; }
.ai p, .ai li { max-width: 68ch; margin: 6px 0; }
.ai ul { padding-left: 20px; margin: 6px 0; }
.status { font-size: 13px; color: var(--ink2); }
.err { color: var(--bad); }
.foot { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--mute); max-width: 80ch; }
@media (max-width: 520px) { th, td { padding: 6px 7px; } .panel { padding: 12px; } }
.qc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.qc .qm { font-weight: 600; margin: 4px 0 2px; }
.qc .qa { color: var(--mute); font-size: 13px; margin-bottom: 8px; }
.qo { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; margin-top: 8px; cursor: pointer; min-height: 40px; color: inherit; font: inherit; }
.qo:hover:not(:disabled) { border-color: var(--accent); }
.qo.good { border-color: var(--good); background: var(--tint); }
.qo.bad { border-color: var(--bad); }
.qx { margin-top: 10px; font-size: 13.5px; color: var(--ink2); }
.qx .v { margin-top: 10px; }
</style>

<div class="wrap">
  <header class="mast">
    <div class="cobar" id="cobar"></div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="co"></h1>
    <p class="lede" id="lede"></p>
    <div class="stamp" id="stamp"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="sections"></nav>
  <main>
    <section id="v-overview" class="view"></section>
    <section id="v-journal" class="view" hidden></section>
    <section id="v-ledger" class="view" hidden></section>
    <section id="v-statements" class="view" hidden></section>
    <section id="v-learn" class="view" hidden></section>

  </main>

</div>
<div class="tip" id="tip" hidden></div>

<script>
/* Ledger engine: deterministic daily simulation of twelve companies, one per industry. */
var Engine = (function () {
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function parse(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
  function fmtD(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
  function addDays(s, n) { return fmtD(parse(s) + n * 864e5); }
  function dow(s) { return new Date(parse(s)).getUTCDay(); }
  function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function monthAdd(key, n) {
    var y = +key.slice(0, 4), m = +key.slice(5, 7) - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + p2(m + 1);
  }
  function monthEnd(key) { return key + '-' + p2(dim(+key.slice(0, 4), +key.slice(5, 7))); }
  function hash(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return h >>> 0;
  }
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rd(x, u) { u = u || 100; return Math.round(x / u) * u; }
  function vat(x, r) { return Math.round(x * (r == null ? 0.13 : r)); }

  /* Each morning at 08:00 Beijing (= 00:00 UTC) that day's vouchers are released. */
  var START = '2026-11-01';
  function businessDate(nowMs) { return fmtD(nowMs); }
  function nextRefresh(nowMs) { return parse(fmtD(nowMs)) + 864e5; }

  /* ---------- chart of accounts helper ---------- */
  function A(c, t, g, f) { var o = { c: c, t: t, g: g || null }; for (var k in (f || {})) o[k] = f[k]; return o; }
  var CO = {};

  /* ===== 1. Manufacturing: coffee roaster ===== */
  CO.nsr = {
    id: 'nsr', salt: 'nsr2',
    accounts: [
      A('1001', 'A', 'ca', { cash: 1 }), A('1101', 'A', 'ca', { wc: 1 }), A('1201', 'A', 'ca', { wc: 1 }), A('1202', 'A', 'ca', { wc: 1 }), A('1301', 'A', 'ca', { wc: 1 }),
      A('1501', 'A', 'nca', { inv: 1 }), A('1502', 'A', 'nca', { contra: 1, ex: 1 }),
      A('2001', 'L', 'cl', { wc: 1 }), A('2101', 'L', 'cl', { wc: 1 }), A('2201', 'L', 'cl', { wc: 1 }), A('2301', 'L', 'cl', { fin: 1 }),
      A('3001', 'E'), A('3101', 'E'), A('4001', 'R'), A('5001', 'C'),
      A('6101', 'X'), A('6102', 'X'), A('6103', 'X'), A('6104', 'X'), A('6105', 'X'), A('6106', 'X', null, { nc: 1 }), A('6107', 'I')
    ],
    bsA: ['ca', 'nca'], bsL: ['cl'],
    quick: ['1001', '1101'], arCode: '1101', apCode: '2001', invCodes: ['1201', '1202'],
    ratios: ['current', 'quick', 'gm', 'nm', 'opex', 'dso', 'dpo', 'inv', 'de'], kpi: ['gm', 'current', 'dso'],
    find: ['dso', 'current', 'inv'],
    init: function (e) { e.st.vatDue = 0; e.st.ar = []; e.st.ap = []; },
    daily: function (e) {
      var st = e.st, bal = e.bal, post = e.post, R = e.R, day = e.day, dd = e.dd, mm = e.mm, w = e.w, i = e.i;
      var ramp = i < 3 ? 0 : Math.min(1, 0.25 + 0.75 * (i - 3) / 75);
      var season = [.95, .92, 1, 1.02, 1.03, 1, .97, .98, 1.04, 1.07, 1.12, 1.15][mm - 1] * (1 + .004 * e.months);
      if (i === 0) post({ k: 'open' }, [['1001', 1500000, 0], ['3001', 0, 1500000]]);
      if (i === 1) {
        post({ k: 'equip' }, [['1501', 600000, 0], ['2201', 78000, 0], ['1001', 0, 678000]]);
        post({ k: 'rent_prepay' }, [['1301', 60000, 0], ['1001', 0, 60000]]);
      }
      if (i === 2) {
        post({ k: 'loan_draw' }, [['1001', 300000, 0], ['2301', 0, 300000]]);
        post({ k: 'purchase', s: 0, n: 'PO-FIRST' }, [['1201', 200000, 0], ['2201', 26000, 0], ['2001', 0, 226000]]);
        st.ap.push({ due: addDays(day, 30), amt: 226000, s: 0, po: 'PO-FIRST' });
      }
      if (i > 1 && dd === 1 && (mm === 2 || mm === 5 || mm === 8 || mm === 11)) post({ k: 'rent_prepay' }, [['1301', 60000, 0], ['1001', 0, 60000]]);
      if (dd === 2 && bal['2101'] < 0) { var sal = -bal['2101']; post({ k: 'pay_salary' }, [['2101', sal, 0], ['1001', 0, sal]]); }
      if (dd === 15 && st.vatDue > 0) { post({ k: 'pay_vat' }, [['2201', st.vatDue, 0], ['1001', 0, st.vatDue]]); st.vatDue = 0; }
      if (dd === 3 && i >= 3) { var mk = rd(8000 + R() * 6000); post({ k: 'mkt' }, [['6105', mk, 0], ['1001', 0, mk]]); }
      if (dd === 28 && (mm === 3 || mm === 6 || mm === 9 || mm === 12) && -bal['2301'] >= 50000) post({ k: 'loan_repay' }, [['2301', 50000, 0], ['1001', 0, 50000]]);
      if (dd === 29 && mm === 6) post({ k: 'dividend' }, [['3101', 150000, 0], ['1001', 0, 150000]]);
      if (dd === 8 && (mm === 4 || mm === 10) && i > 1) post({ k: 'equip' }, [['1501', 60000, 0], ['2201', 7800, 0], ['1001', 0, 67800]]);
      if (dd === 20 && i >= 3) { var ut = rd(6500 + R() * 3000); post({ k: 'util' }, [['6103', ut, 0], ['1001', 0, ut]]); }
      if (dd === 25 && bal['2301'] < 0) { var it = Math.round(-bal['2301'] * 0.032 / 12); post({ k: 'interest' }, [['6107', it, 0], ['1001', 0, it]]); }
      if (w !== 0) {
        collect(e, 'collect', '1001', '1101'); pay(e, 'paysup', '2001', '1001');
        if (i >= 3 && (w === 1 || w === 4)) {
          var need = Math.max(30000, 160000 - bal['1201']);
          var net = rd(need * (0.9 + 0.2 * R()), 1000), v = vat(net), s = Math.floor(R() * 4), po = 'PO-' + e.ymd;
          post({ k: 'purchase', s: s, n: po }, [['1201', net, 0], ['2201', v, 0], ['2001', 0, net + v]]);
          st.ap.push({ due: addDays(day, 30), amt: net + v, s: s, po: po });
        }
        if (i >= 3) {
          var roast = Math.min(bal['1201'] - 18000, Math.max(0, 95000 - bal['1202']));
          if (roast >= 5000) { roast = rd(roast); post({ k: 'roast' }, [['1202', roast, 0], ['1201', 0, roast]]); }
        }
        if (i >= 4) {
          var k = w === 6 ? (R() < 0.5 ? 1 : 0) : 1 + (R() < 0.55 ? 1 : 0) + (R() < 0.3 ? 1 : 0);
          for (var j = 1; j <= k; j++) {

Object.assign(I18N.zh.lessons, {

  fx_reval: ['期末汇率重估', '月末还没收回的美元应收账款，要按期末汇率重新折算，差额记汇兑损益，这样资产负债表上的金额才是现在的价值。'],

  cip: ['在建工程', '厂房还在盖，支出先记入在建工程，不提折旧。工程款里的进项增值税单独记在应交税费的借方。'],
  cip_done: ['在建工程转固', '厂房完工验收后，把在建工程的总额转入固定资产，从下个月开始计提折旧。'],
  rd_cap: ['研发支出资本化', '研发分研究阶段和开发阶段。研究阶段的支出直接计入研发费用，开发阶段符合条件的可以资本化，借记开发支出，记为资产。'],
  amort_int: ['无形资产摊销', '资本化的研发成果投入使用后，按预计年限分期摊销：借记摊销费用，贷记累计摊销，和固定资产折旧类似。'],
  warranty: ['预计负债：产品质量保证', '卖出产品要承担质保责任，维修费用以后才发生，所以销售当月就按销售额预提：借记销售费用，贷记预计负债。实际维修时借记预计负债。'],

Object.assign(I18N.en.lessons, {
  fx_sale: ['Foreign currency sales', 'A sale in US dollars is booked in yuan at that day’s rate: debit receivables, credit revenue. The receivable also keeps its dollar amount, used for every later conversion.'],
  fx_collect: ['Collecting and exchange differences', 'If the rate on the day of payment differs from the booking rate, the yuan the bank receives differs too. The difference goes to exchange gains and losses: more cash is a gain, less is a loss.'],
  fx_reval: ['Month-end revaluation', 'Dollar receivables still open at month-end are converted again at the closing rate and the difference goes to exchange gains and losses, so the balance sheet shows what they are worth now.'],
  taxrefund: ['Export tax refund', 'Export sales carry no output VAT, so the input VAT on domestic purchases is refunded. First debit the refund receivable and credit VAT payable; debit cash when the money arrives.'],
  cip: ['Construction in progress', 'While the plant is still being built, spending goes to construction in progress and no depreciation is charged. Input VAT in the payments is debited to the tax account separately.'],
  cip_done: ['Transfer to fixed assets', 'When the plant is finished and accepted, the total in construction in progress moves to fixed assets, and depreciation starts the next month.'],
  rd_cap: ['Capitalising development costs', 'R&D has a research stage and a development stage. Research spending is expensed; development spending that meets the conditions can be capitalised, debited to development costs as an asset.'],
  amort_int: ['Amortising intangible assets', 'Once capitalised development results are in use, they are written off over their useful life: debit amortisation expense, credit accumulated amortisation, like depreciation.'],
  warranty: ['Warranty provisions', 'Selling a product brings a warranty duty, but repairs come later, so the cost is provided for in the month of sale: debit expense, credit a provision liability. Actual repairs are debited to the provision.'],
  writedown: ['Inventory write-down', 'Stock may not sell or may sell below cost, so a write-down is made ahead: debit impairment loss, credit the write-down allowance. The allowance is a contra account and lowers the carrying value of inventory.'],
  bio: ['Biological assets', 'Growing crops and livestock are biological assets. Seedlings, fertiliser and labour are added to the asset, not expensed, and move to inventory only at harvest.'],
  harvest: ['Harvest to inventory', 'After harvest the crop is no longer a biological asset, so its carrying value moves into inventory: debit inventory, credit biological assets.'],
  fv: ['Fair value changes', 'Biological assets are measured at fair value. If fair value at period end is above the book value, the asset is raised and the gain is credited to fair value gains. No cash has been received.'],
  subsidy: ['Government grants', 'A farming subsidy is not sales revenue. Debit cash and credit other income. It raises profit, but not from trading.']
});

  ['筹划和偷税的界限', '筹划是在法律允许的范围内，用真实的业务安排降低税负。偷税是虚构业务、隐瞒收入或虚开发票。判断标准是业务是否真实，合同、发票、付款记录是否一致。'],
  ['一般纳税人还是小规模纳税人', '一般纳税人按销项减进项缴增值税，税率 13%、9%、6%，进项可以抵扣。小规模纳税人按征收率计税，不能抵扣进项。采购多、客户要专用发票，一般纳税人更合适；进项少、客户多是个人，小规模可能更省。'],

  ['免税、零税率和不征税', '免税是销售不交增值税，对应的进项税也不能抵扣，要转入成本，比如本案例里的医疗服务和农产品。零税率（出口）是销项为零，进项税还可以退，比如外贸公司的出口退税。两者看起来都不交税，处理完全不同。'],

  ['费用扣除限额', '业务招待费按发生额的 60% 扣除，且不超过当年销售收入的 5‰；广告费和业务宣传费不超过销售收入的 15%，超过的结转以后年度；公益性捐赠不超过年度利润总额的 12%，超过部分可以结转三年。'],

  ['申报节奏和凭证管理', '增值税按月申报，企业所得税按季度预缴，次年 5 月 31 日前汇算清缴。合同、发票、付款凭证、入库单要对得上，这是应对税务检查的基础。']

I18N.en.taxTopics = [
  ['Planning versus evasion', 'Planning uses real business arrangements, within the law, to lower tax. Evasion is made-up transactions, hidden income or false invoices. The test is whether the business is real and whether contracts, invoices and payment records agree.'],
  ['General taxpayer or small-scale taxpayer', 'A general taxpayer pays output VAT less input VAT at 13%, 9% or 6% and can deduct input VAT. A small-scale taxpayer pays at a levy rate and cannot deduct input VAT. With many purchases and customers who want special invoices, general taxpayer status fits; with few inputs and mostly individual customers, small-scale status may cost less.'],
  ['Managing input VAT', 'Get proper special VAT invoices and certify them in time. When input exceeds output, the credit carries forward and, if the conditions are met, can be claimed as a refund. A purchase with no invoice gives no input VAT, and the cost may not be deductible for income tax either.'],
  ['Exempt, zero-rated and not taxable', 'Exempt sales carry no VAT and the related input VAT cannot be deducted, so it goes into cost, as with the medical services and farm produce in this case. Zero-rated sales (exports) carry no output VAT and the input VAT can be refunded, as with the exporter’s tax refund. Both look tax-free, but they are handled very differently.'],
  ['Corporate income tax rates', 'The basic rate is 25%, and 15% for high-tech enterprises. A small low-profit enterprise has taxable income up to RMB 3 million, up to 300 staff and assets up to RMB 50 million. Its taxable income is counted at 25% and taxed at 20%, an effective 5%, through 31 December 2027.'],
  ['Super-deduction for R&D', 'Expensed R&D is deducted as incurred and then a further 100%; capitalised R&D that becomes an intangible asset is amortised at 200% of cost. R&D costs must be tracked separately, with project approval, staff and hours on file.'],
  ['Accelerated depreciation and one-time deduction', 'Equipment costing up to RMB 5 million per item can be deducted in full in the year it is bought, under the current rule that runs to the end of 2027. The books still depreciate it over its life, so the tax and the accounts differ, and cash tax is deferred.'],
  ['Carrying losses forward', 'A loss in one year can offset later profits, for 5 years in general and 10 years for high-tech enterprises and tech SMEs. A start-up that loses money in its first years can use those losses later, so keep clear records.'],
  ['Deduction limits on expenses', 'Entertainment is deductible at 60% of the amount, capped at 0.5% of sales revenue. Advertising and promotion are capped at 15% of sales revenue, with the excess carried forward. Charitable donations are capped at 12% of annual profit, with the excess carried forward for three years.'],
  ['When revenue is recognised', 'The accounts recognise revenue as the contract is performed, tax law has its own rules, and VAT also looks at payment, invoicing and the contract date. Contract terms and invoice timing can be arranged to manage cash flow, but revenue must not be pushed back just to pay less tax.'],
  ['How shareholders take returns', 'A shareholder who works for the company can draw a salary, taxed as comprehensive income, or take a dividend, taxed at 20% after the company has already paid income tax. Which is better takes a full calculation, and salary has to be reasonable.'],
  ['Related-party transactions and transfer pricing', 'Prices between related companies must be at arm’s length. If a price strays clearly from the market, the tax authority can adjust it. Group loans, service fees and sales of goods all need contracts and pricing evidence.'],
  ['Tax–book differences and deferred tax', 'Accounting profit is not taxable income. Differences are temporary (such as different depreciation lives, which reverse later) or permanent (such as entertainment over the limit, which never reverses). Temporary differences create deferred tax assets or liabilities.'],
  ['Filing rhythm and paperwork', 'VAT is filed monthly, income tax is prepaid quarterly and settled by 31 May of the next year. Contracts, invoices, payment records and goods-received notes must agree. That is the basis for any tax inspection.']
];

I18N.zh.lessons.vatsmall = ['小规模纳税人的增值税', '小规模纳税人按销售额的 1% 简易计税，不能抵扣进项；买东西付的增值税直接算进成本。月销售额不超过 10 万元时，当月增值税免征，把已经计提的增值税转为“其他收益”。'];
I18N.en.lessons.vatsmall = ['VAT for small-scale taxpayers', 'A small-scale taxpayer pays VAT at a simple 1% of sales and cannot deduct input VAT, so VAT paid on purchases becomes part of the cost. When monthly sales are within ¥100,000 that month’s VAT is exempt, and the VAT already accrued is moved to other income.'];
I18N.zh.lessons.clientfund = ['客户资金是负债', '证券、期货公司替客户保管的交易资金和保证金不是自己的收入。收到时记“银行存款（客户）”和对客户的负债，客户取走时反向冲减，只有赚到的佣金和利息才转成公司收入。'];
I18N.en.lessons.clientfund = ['Client money is a liability', 'Trading cash and margin that a broker holds for clients is not the broker’s revenue. It is booked as client cash and a liability to clients, reduced when clients withdraw, and only earned commission and interest are moved into the firm’s own income.'];
I18N.zh.lessons.commission = ['佣金收入与通道成本', '经纪业务按成交金额收取佣金，其中含增值税；同时要向交易所等机构支付费用，收入扣掉这些费用才是净收入。基金公司支付给销售渠道的服务费也属于同类成本。'];
I18N.en.lessons.commission = ['Commission income and pass-through costs', 'Brokerage commission is charged on traded value and includes VAT, while fees must be paid to exchanges and others; revenue less these fees is the real net income. A fund manager’s channel fees are a similar cost.'];
I18N.zh.lessons.marginloan = ['融资融券与减值', '向客户融出资金形成融出资金资产，按日计提利息并在约定时收回；和贷款一样，要按风险计提减值准备，减值进入损益。'];
I18N.en.lessons.marginloan = ['Margin lending and impairment', 'Money lent to clients is an asset, interest accrues daily and is collected later; like any loan it needs an allowance for expected losses, charged to profit or loss.'];
I18N.zh.lessons.mgmtfee = ['按管理规模计提管理费', '基金管理费等于基金规模乘以费率，每天计提、按月收取，所以先记应收管理费。规模涨跌会直接影响收入；业绩报酬只有在约定的考核期结束后才能确认。'];
I18N.en.lessons.mgmtfee = ['Management fee on assets under management', 'The management fee equals fund size times the fee rate, accrued daily and collected monthly, so a fee receivable comes first. Changes in size move revenue directly; a performance fee is recognised only after the measurement period ends.'];
I18N.zh.lessons.fairvalue = ['公允价值变动'] .concat(['自有投资按市价计量，价格上升记投资收益，下降记投资损失，不论是否卖出。这就是为什么金融公司的利润会随市场波动。']);
I18N.en.lessons.fairvalue = ['Fair value changes', 'Own investments are measured at market price: a rise is booked as investment gain and a fall as loss, whether or not they are sold. That is why a financial firm’s profit moves with the market.'];
I18N.zh.lessons.ownerdraw = ['业主提款', '个体工商户的经营所得属于业主。业主从店里拿钱用，要冲减业主权益，不是工资，也不是费用，所以不会减少利润。'];

    ['收入', '卖东西或提供服务赚到的钱。收入在贷方增加。', 1],

I18N.en.gloss = { t: 'Glossary and account lookup', h: 'Type a word or an account code to search accounting terms and this company’s accounts together. Tags show difficulty: beginner, intermediate and advanced, so you can work upward.', ph: 'Search, e.g. depreciation, prepaid, 1001', accT: 'Accounts of this company', termT: 'Accounting terms', code: 'Account', side: 'Normal balance', bal: 'Balance now', last: 'Last used', dr: 'Debit', cr: 'Credit', none: 'Nothing matches.',
  terms: [
    ['Debit and credit', 'The two sides of an entry, not “money in” and “money out”. Assets and expenses increase on the debit side; liabilities, equity and revenue increase on the credit side. In every entry total debits equal total credits.', 1],
    ['Double entry', 'Each transaction is recorded in at least two accounts, one debited and one credited for the same amount, so the books check themselves.', 1],
    ['Account', 'A name and code for each kind of asset, liability, equity, revenue or expense, such as 1001 Cash and bank deposits.', 1],
    ['Voucher (journal entry)', 'The record of one transaction: date, description, accounts debited and credited, and amounts. It is where the books begin.', 1],
    ['General ledger', 'All vouchers gathered by account, showing each account’s opening balance, activity and closing balance.', 1],
    ['Trial balance', 'A list of every account balance. Total debits should equal total credits; if not, the books contain an error.', 1],
    ['Asset', 'Something the company owns that will bring benefit, such as cash, stock, equipment and receivables.', 1],
    ['Liability', 'What the company owes or must do for others, such as loans, payables and accrued wages.', 1],
    ['Equity', 'What is left for the owners after liabilities are taken from assets: capital paid in plus profits kept.', 1],
    ['Revenue', 'Money earned by selling goods or services. Revenue increases on the credit side.', 1],
    ['Expense', 'Money spent to earn revenue, such as rent, wages and utilities. Expenses increase on the debit side.', 1],
    ['Accounts receivable', 'Goods have been sold but cash has not yet arrived: the customer owes the company.', 1],
    ['Accounts payable', 'Goods have been bought but not yet paid for: the company owes the supplier.', 1],
    ['Prepaid expense', 'Money paid now for a benefit spread over coming months, such as prepaid rent. It is first an asset, then moved to expense month by month.', 2],
    ['Contract liability (deferred revenue)', 'The customer has paid but the service has not been given. Booked as a liability, then turned into revenue as the service is delivered.', 2],
    ['Accrual basis', 'Revenue and expenses are recorded when they occur, not when cash moves. Financial statements follow this principle.', 2],
    ['Accrued expense', 'An expense incurred but not yet paid, such as wages at month-end. Record the expense and a payable together.', 2],
    ['Depreciation', 'Spreading the cost of equipment over its useful life as an expense each period. It uses no cash, so it is added back in the cash flow statement.', 2],
    ['Amortisation', 'Like depreciation but for prepaid costs and intangible assets, spreading cost over the period that benefits.', 2],
    ['Cost of sales transfer', 'When goods are sold, their cost moves from inventory to cost of goods sold, so gross profit is measured properly.', 2],
    ['Gross profit', 'Revenue less cost of sales. Gross margin = gross profit ÷ revenue, showing whether selling itself pays.', 2],
    ['Operating income', 'Gross profit less operating expenses. It shows earning power from day-to-day business, before interest and tax.', 2],
    ['VAT (input and output)', 'Output VAT is collected from customers on sales; input VAT is paid to suppliers on purchases. The net is paid to the tax office, and excess input VAT carries forward.', 2],
    ['Income tax expense', 'Corporate income tax on profit. On the income statement it is deducted after profit before tax to reach net profit.', 2],
    ['Allowance for bad debts', 'An allowance set aside for receivables that may not be collected: debit credit-loss expense, credit the allowance, shown as a deduction from receivables.', 3],
    ['Inventory write-down', 'When stock could sell for less than cost, the difference is written off so the asset is not overstated.', 3],
    ['Deferred tax asset', 'An expense recognised now that tax will only allow later. The extra tax paid now comes back later, so it is an asset.', 3],
    ['Exchange gain or loss', 'Foreign currency items are converted to yuan at different dates’ rates; the difference goes to finance costs.', 3],
    ['Percentage of completion', 'Construction revenue and cost are recognised as work progresses, not only at completion.', 3],
    ['Indirect cash flow statement', 'Starts from net profit, adds back non-cash items and adjusts for working capital to reach operating cash flow.', 3],
    ['Current ratio', 'Current assets ÷ current liabilities, a measure of short-term solvency. Above about 1.5 is usually comfortable, though industries differ.', 2],
    ['Reconciling item', 'A difference between the bank’s record and the company’s because of timing, such as deposits in transit and outstanding cheques.', 2],
    ['Red-letter correction', 'Reverse the wrong entry with a negative (red) entry, then book the right one. Used when the wrong account or too large an amount was booked.', 2],
    ['Supplementary entry', 'When an amount was booked too small, book another entry for the difference.', 2],
    ['Closing the books', 'Checking balances and posting accruals, amortisation and depreciation each period; at year-end profit and loss moves to retained earnings and a new year begins.', 2]
  ] };
